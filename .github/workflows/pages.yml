name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ['pages/**', 'app/src/main/play/listings/en-US/graphics/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Copy Play Store graphics to Pages assets
        run: |
          mkdir -p pages/assets/images/
          cp app/src/main/play/listings/en-US/graphics/feature-graphic/feature-graphic.png pages/assets/images/feature-graphic.png
          # Screenshots are optional (upstream ones were removed for licensing reasons)
          SHOTS=app/src/main/play/listings/en-US/graphics/phone-screenshots
          for pair in 1-home:home 2-library:library 3-audiobook:audiobook 4-currentlyplaying:playing 5-search:search 6-settings:settings; do
            src="$SHOTS/${pair%%:*}.png"; dst="pages/assets/images/${pair##*:}.png"
            if [ -f "$src" ]; then cp "$src" "$dst"; fi
          done
      
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages
          destination: ./_site
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
